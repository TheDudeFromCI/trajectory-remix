generation_mode: content-first
system_prompt: You are Kidra, a competent autonomous coordinator. No user is present
  in this idle session. Follow standing responsibilities and actual scheduler, TODO
  and tool observations. Choose useful work, preserve needed state, and stop quietly
  when nothing actionable remains. Do not invent user requests, tool results or permission.
version: 1
description: Autonomous idle work on TODOs, files, memory and alarms, with separate
  trajectory validation.
tag: idle_scenario
schemas:
  Workspace:
    type: object
    properties:
      identifier:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+){2,3}$
      situation:
        type: string
        minLength: 1
        maxLength: 1500
      success_criteria:
        type: string
        minLength: 1
        maxLength: 1500
      idle_context:
        type: string
        minLength: 1
        maxLength: 1600
      files:
        type: array
        maxItems: 4
        items:
          type: object
          properties:
            path:
              type: string
              minLength: 1
            content:
              type: string
              maxLength: 1800
          required:
          - path
          - content
          additionalProperties: false
      operations:
        type: array
        maxItems: 8
        items:
          type: object
          properties:
            tool:
              type: string
              enum:
              - note_save
              - memory_save
              - time_set
            arguments:
              type: object
          required:
          - tool
          - arguments
          additionalProperties: false
    required:
    - identifier
    - situation
    - success_criteria
    - idle_context
    - files
    - operations
    additionalProperties: false
  Action:
    type: object
    properties:
      streams:
        type: array
        minItems: 1
        maxItems: 3
        items:
          type: object
          properties:
            content:
              type: string
              minLength: 1
          required:
          - content
          additionalProperties: false
      calls:
        type: array
        maxItems: 6
        items:
          type: object
          properties:
            tool:
              type: string
              enum:
              - file_list
              - file_read
              - file_stat
              - file_search
              - file_write
              - file_patch
              - note_save
              - note_delete
              - memory_save
              - memory_search
              - calculator
              - time_now
              - timer
            arguments:
              type: object
          required:
          - tool
          - arguments
          additionalProperties: false
      release_windows:
        type: array
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          minLength: 1
      finished:
        type: boolean
    required:
    - streams
    - calls
    - release_windows
    - finished
    additionalProperties: false
    allOf:
    - if:
        properties:
          finished:
            const: true
      then:
        properties:
          calls:
            maxItems: 0
tags:
  domain:
  - name: project maintenance
    description: Review and reconcile project files or documentation.
    weight: 1
  - name: task management
    description: Prioritize TODOs and respect blockers and completion evidence.
    weight: 1
  - name: knowledge organization
    description: Consolidate notes or memory without losing source facts.
    weight: 1
  - name: scheduling
    description: Handle due alarms or maintain a schedule using the synthetic clock.
    weight: 1
  trigger:
  - name: idle tick
    description: Routine idle opportunity with standing responsibilities.
    weight: 1
  - name: TODO backlog
    description: Existing prioritized tasks need attention.
    weight: 1
  - name: alarm fired
    description: A scheduler alarm has fired; its payload and standing handling policy
      are visible.
    weight: 1
  - name: project changed
    description: A scheduler reports a changed project artifact; inspect its actual
      contents.
    weight: 1
  complication:
  - name: straightforward
    description: A small concrete action with checkable effects.
    weight: 1
  - name: blocked work
    description: Missing evidence or an unfinished dependency prevents some work.
    weight: 1
  - name: competing priorities
    description: Choose between useful tasks using urgency and dependencies.
    weight: 1
  - name: contradictory files
    description: Reconcile inconsistent project facts using explicit source authority.
    weight: 1
  - name: quiet workspace
    description: Nothing needs changing; recognize this without inventing work.
    weight: 1
roles:
  kidra:
    instructions: Work privately from visible state. Prioritize and coordinate rather
      than narrating to an absent user. Update TODOs only after observed evidence,
      handle alarms without confusing a wake event with successful follow-up work,
      and retain exact task state across bounded decisions.
    tags: {}
steps:
  idea:
    uses: llm.content
    needs: []
    inputs:
      conditions: ${scenario.tags}
      setup_tools:
        note_save: ${tool_contracts.note_save}
        memory_save: ${tool_contracts.memory_save}
        time_set: ${tool_contracts.time_set}
    prompt: workspace.md
    endpoint: generator
    output_schema: Workspace
    visible_windows: []
    retries: 0
    on_failure:
      action: reject
    when: true
    steps: {}
    max_iterations: 1
    history: {}
    checks: {}
    repair_mode: replay
    repair_max_input_tokens: 8000
    repair_guides: []
    max_repairs: 0
    review_retries: 2
    level: 1
    attempts: 3
    fallback: true
  environment:
    uses: remix.setup
    needs:
    - idea
    inputs:
      idea: ${steps.idea.output}
      operations: ${steps.idea.output.operations}
    endpoint: generator
    visible_windows: []
    retries: 0
    on_failure:
      action: reject
    when: true
    steps: {}
    max_iterations: 1
    history: {}
    checks: {}
    repair_mode: replay
    repair_max_input_tokens: 8000
    repair_guides: []
    max_repairs: 0
    review_retries: 2
    level: 1
    attempts: 3
    fallback: true
  wake:
    uses: remix.assemble
    needs:
    - environment
    inputs:
      streams:
      - window: idle-context
        type: document
        op: append
        source: system
        content: ${steps.idea.output.idle_context}
    endpoint: generator
    visible_windows: []
    retries: 0
    on_failure:
      action: reject
    when: true
    steps: {}
    max_iterations: 1
    history: {}
    checks: {}
    repair_mode: replay
    repair_max_input_tokens: 8000
    repair_guides: []
    max_repairs: 0
    review_retries: 2
    level: 1
    attempts: 3
    fallback: true
  work:
    uses: flow.repeat
    needs:
    - wake
    inputs: {}
    endpoint: generator
    visible_windows: []
    retries: 0
    on_failure:
      action: reject
    when: true
    steps:
      decide:
        uses: llm.content
        needs: []
        inputs:
          cycle: ${iteration.index}
          tools:
            file_list: ${tool_contracts.file_list}
            file_read: ${tool_contracts.file_read}
            file_stat: ${tool_contracts.file_stat}
            file_search: ${tool_contracts.file_search}
            file_write: ${tool_contracts.file_write}
            file_patch: ${tool_contracts.file_patch}
            note_save: ${tool_contracts.note_save}
            note_delete: ${tool_contracts.note_delete}
            memory_save: ${tool_contracts.memory_save}
            memory_search: ${tool_contracts.memory_search}
            calculator: ${tool_contracts.calculator}
            time_now: ${tool_contracts.time_now}
            timer: ${tool_contracts.timer}
        prompt: action.md
        profile: kidra
        endpoint: generator
        output_schema: Action
        visible_windows:
        - '*'
        retries: 0
        on_failure:
          action: reject
        when: true
        steps: {}
        max_iterations: 1
        history: {}
        checks: {}
        repair_mode: replay
        repair_max_input_tokens: 8000
        repair_guides: []
        max_repairs: 0
        review_retries: 2
        level: 1
        attempts: 3
        fallback: true
      act:
        uses: remix.assemble
        needs:
        - decide
        inputs:
          streams: ${steps.decide.output.streams}
          calls: ${steps.decide.output.calls}
          release_windows: ${steps.decide.output.release_windows}
        endpoint: generator
        visible_windows: []
        retries: 0
        on_failure:
          action: reject
        when: true
        steps: {}
        max_iterations: 1
        history: {}
        checks: {}
        repair_mode: replay
        repair_max_input_tokens: 8000
        repair_guides: []
        max_repairs: 0
        review_retries: 2
        level: 1
        attempts: 3
        fallback: true
    max_iterations: 12
    until: ${steps.decide.output.finished}
    history: {}
    checks: {}
    repair_mode: replay
    repair_max_input_tokens: 8000
    repair_guides: []
    max_repairs: 0
    review_retries: 2
    level: 1
    attempts: 3
    fallback: true
  finish:
    uses: remix.draft
    needs:
    - work
    inputs: {}
    endpoint: generator
    visible_windows: []
    retries: 0
    on_failure:
      action: reject
    when: true
    steps: {}
    max_iterations: 1
    history: {}
    checks: {}
    repair_mode: replay
    repair_max_input_tokens: 8000
    repair_guides: []
    max_repairs: 0
    review_retries: 2
    level: 1
    attempts: 3
    fallback: true
