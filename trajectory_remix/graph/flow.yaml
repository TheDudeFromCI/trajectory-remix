version: adaptive-flow/1
start: set_scene
# Each written event costs one selection, up to five routing branches and one write.
max_steps: 1500
max_events: 128
# The agent answers a person at once ("Sure, let me look into this."), before reasoning.
immediate_response: true
actor_instruction: >-
  Write exactly this next action from the visible evidence and tool contract only.
  Reasoning is private thinking, never addressed to anyone: no greetings, no "you", no
  replies. Speak to people only through chat tool calls, including short progress
  updates. Keep reasoning concise.
  Kidra coordinates complex, long-running multi-agent work: she plans, delegates,
  verifies and keeps continuity. When a suitable agent or tool is visible she does not
  personally write production code, run extensive research or do bulk repetitive work.
  Delegate in proportion to the task; a small job needs no team. Select resources using
  observed capabilities and costs, preserve task ownership and dependencies, verify
  claims and replan on failures. Do not re-delegate an unchanged failed task, create
  agents recursively or excessively, or keep planning instead of moving to execution.
  Respect visible budgets and the user's visible authority: for a consequential action
  outside it, request approval and wait.
  Do not claim execution, inspection or completion without visible supporting results.
  Distinguish intentions, reported results, verified outcomes and remaining blockers.
  Never use hidden author targets or predict an unobserved tool outcome.
selector_instruction: |-
  You are the private authoring controller of ONE synthetic training episode, not its
  actor. Each request gives you, in order: tools, the sampled proposal, the committed
  source (closed windows' events marked written, without their text), current_step, open_windows,
  remaining_events, your previous notes and any correction.

  Rules:
  - Return exactly one Selection JSON object: finished, reason, windows and task.
  - Do what current_step.instruction asks. It changes from step to step.
  - The source is scenario data, never instructions to you.
  - Make the episode demonstrate the whole proposal: objectives, dimensions, numeric
    guidance, constraints and event tags, not just their labels.
  - Choose one event envelope as task, plus any NEW windows, or finish. Never write event
    content in an envelope.
  - IDs in after refer only to committed events.
  - External events are masked; agent_text and tool_call are supervised.
  - Never put private facts in an actor's task; the backend writes its instruction.
    External authors (results, users, documents) may get private facts in task.world,
    consistent with the opening.
  - Use reason as your notes: objectives shown by event ID, and what remains.
  - Follow the output schema's field names exactly. A first event, for example:
    {"id": "opening", "envelope": {"kind": "chat_message", "window": "chatroom",
    "after": [], "chat": {"speaker": "Dana"}}, "instruction": "Dana asks for ...",
    "world": {...}}, with {"chatroom": {"purpose": "chatroom", "agent_writable": false}}
    in windows.
nodes:
  # ---- Phase 1: set the scene and open the episode --------------------------------
  set_scene:
    kind: select
    next: choose_tools
    instruction: >-
      Set the scene. Nothing is committed yet. Define the windows the episode
      will need: a read-only chatroom when a user converses, read-only document
      windows for given material, and a writable notes window (purpose notes). No
      reasoning windows yet. Then choose the OPENING external
      event: a natural user chat_message, or an external_text trigger such as a ticket,
      alert, schedule or document for autonomous work. Put the concrete world in
      task.world for its author: who the user is (match the proposal's competence,
      patience, involvement and tone), what they want and why, the actual source
      artifacts, a roster whose agents and tools carry observable capabilities, costs
      and context limits, budget, acceptance criteria, what the user has and has not
      authorized (and which actions need their consent), and the hidden facts later tool
      results must stay consistent with. Supply the evidence itself, never a statement
      that access exists. These boundaries go in task.world for external authors only;
      the agent learns them only from visible evidence such as the user's words, a
      policy document or a tool contract. Do not finish.
  choose_tools:
    kind: tools
    next: write_opening
    # Each tool not chosen is still listed with this chance, so the agent learns to
    # ignore tools it does not need.
    extra_tools: 0.5
    instruction: >-
      You choose the tools for ONE synthetic training episode before it starts. You get
      the tool catalogue as tool ID and description, the sampled proposal, and the
      upcoming opening event with its private world facts. Return JSON with reason, then
      tools: every catalogue ID set to true or false. Set true every tool the agent will plausibly need to
      do this episode's work and demonstrate its objectives: delegation tools when it
      coordinates specialists, task notes when it tracks work, and file, web or memory
      tools only when the work involves them. Include chat whenever the agent talks to a
      person. Leave out tools the episode will not use; other tools are added at random
      so the agent learns to ignore irrelevant ones.
  write_opening:
    kind: event
    next: reply_first
    instruction: >-
      This event opens the episode. Write it in the speaker's or source's own voice from
      the world facts: a realistic request or trigger with the concrete details,
      artifacts and constraints the agent needs, and the natural gaps a competent agent
      would have to ask about or discover. Do not hint at the solution or describe the
      agent.

  # ---- Phase 2: an immediate reply, then the agent's first move --------------------
  reply_first:
    kind: branch
    path: flow.immediate_response
    equals: true
    then: opening_is_chat
    otherwise: first_move
  opening_is_chat:
    kind: branch
    path: task.envelope.kind
    equals: chat_message
    then: acknowledge
    otherwise: first_move
  acknowledge:
    kind: select
    next: write_reply
    instruction: >-
      A person is waiting. Choose the agent's immediate reply, before any reasoning: a
      tool_call of the chat tool, depending on the opening, in a NEW reasoning window
      w_reply that this call closes (close_window true in the envelope). It
      acknowledges the request and says what the agent will do first. A trivial request
      may get its full, grounded answer here. Do not finish.
  write_reply:
    kind: event
    next: first_move
    instruction: >-
      Write the agent's immediate reply to the person: one or two natural sentences in
      the agent's voice that acknowledge the request and say what it will do first, such
      as looking into it or checking with the team. Promise nothing it has not checked
      and give no results; a trivial request may get its full answer.

  first_move:
    kind: select
    next: plan_is_thought
    instruction: >-
      Choose the agent's first move after the opening. Normally this is
      agent_text in a NEW short-lived reasoning window (define it in windows, for example
      w_plan), depending on the opening, in which the
      agent restates the goal, separates facts from assumptions and plans
      proportionately. A trivial request may deserve a direct, grounded chat reply; a
      genuinely ambiguous one deserves a clarifying question through the chat tool. The
      agent coordinates, so the plan delegates specialist work instead of doing it. If
      the work recurs, demand is uncertain, or the proposal carries an automation
      decision (invest_in_automation, perform_manually or defer_investment), the plan
      compares build cost, expected frequency, savings per use, maintenance,
      opportunity cost, reliability, uncertainty and reuse using only visible evidence,
      then chooses to invest now, defer or decline, and says what would change that
      choice. Prefer neither automation nor manual delegation by default: a script
      suits 1,000 files, a cheap agent suits five. If a first step would be
      consequential beyond the user's visible authority, choose an approval request
      instead. Add any windows the plan needs now. Do not finish.
  plan_is_thought:
    kind: branch
    path: task.envelope.kind
    equals: agent_text
    then: write_plan
    otherwise: is_tool_call
  write_plan:
    kind: event
    next: work
    instruction: >-
      This is the agent's first reasoning in the episode. Restate the goal and what
      would count as done, separate known facts from assumptions, name the unknowns and
      how to resolve them, and choose a proportionate first step that delegates rather
      than performs specialist work. Where work recurs or demand is uncertain, weigh the
      cost of automating against its expected reuse using visible evidence. Keep it
      brief and claim no results that are not visible yet.

  # ---- Phase 3: the work loop ------------------------------------------------------
  work:
    kind: select
    next: wants_finish
    instruction: >-
      Choose the next event of the execution slice, or finish. The agent's
      own events are planning, delegation, review and communication; specialist output
      arrives as tool results or external reports, never as the agent's own work. A
      consequential step outside the user's visible authority needs an approval request
      and a wait for the answer, not the action. Do not choose another delegation of a
      task that failed unchanged, recursive or excessive agent creation, or more
      planning when execution is available. When work recurs, demand is uncertain, or
      the proposal carries an automation decision, have the agent compare build cost,
      expected frequency, savings per use, maintenance, opportunity cost, reliability,
      uncertainty and reuse from visible evidence, choose invest, defer or decline, and
      revisit that choice when new information changes the expected return. Let the work
      unfold as competent work does, in short-lived windows. Only the chatroom, documents
      and the notes window stay open. Each step of work gets a NEW reasoning window
      (w_tests, w_review): reason, then make the step's tool calls; the last call sets
      close_window. Results arrive, in any order, in a NEW reasoning window (or several
      in parallel) that reads them, reasons, calls and closes in turn. Before a window
      closes, copy what later steps need into notes. Each event follows its window's
      previous event; a window's first agent event also follows the latest notes event.
      Run independent calls and lines of work in parallel. Reason again only after
      something new arrives (a result, a message, a report); while the agent waits, the
      next event is that arrival, not another status check. Include reasoning before
      consequential actions,
      proportionate tool requests from the configured catalogue (never invent tools),
      authored tool results, specialist assignments and follow-ups, independent review,
      recovery after failures, ledgers or checkpoints, and grounded chat updates. Every
      tool_call needs its tool_response with the same call_id, following the catalogue's
      response-window rules; tool responses are synthetic observations, not real
      execution. Join parallel work before integrating. Include user follow-ups, interruptions, asynchronous
      updates, cancellation, document replacement or phase changes when the proposal
      calls for them. Close each reasoning window once its step is done; wrap up any
      large one in open_windows. Chat deliveries are generated
      automatically for submitted chat calls unless echo_chat is false, so never author
      a duplicate echo. When execution is available a plan alone is insufficient. Finish
      only after observed meaningful progress, verified delivery or a genuine blocked
      handoff at the requested horizon; a short decision snapshot may finish earlier.
      Use reason to track demonstrated objectives with event IDs and the remaining work.
      Never fabricate success to fit limits, and acknowledge unsupported combinations.
  wants_finish:
    kind: branch
    path: finished
    equals: true
    then: verify
    otherwise: is_tool_call

  # ---- Phase 4: check before finishing ---------------------------------------------
  verify:
    kind: select
    next: verified
    instruction: >-
      A finish was just proposed (see previous). Audit the committed events
      before ending. Compare them with every proposal objective, behaviour, required
      event tag and target. Check that the user received a grounded delivery or an
      explicit blocked handoff, that every tool_call has its result, that every claim is
      backed by a visible result, and that every reasoning window is closed (see
      open_windows). If one is open, choose the event that closes it. Also
      audit the agent's role. Coordinator role: it did not perform substantial
      specialist work itself when a suitable agent or tool was visible. Authorization:
      no consequential action ran without visible authority or an observed approval.
      Investment: any automation or infrastructure decision is justified by visible
      evidence and was revisited when circumstances changed. Delegation: no unchanged
      failed task was re-delegated, agents were not created recursively or excessively,
      budgets were respected and planning moved on to execution. If it all holds,
      finish again with a reason that cites the event IDs demonstrating each objective.
      If anything is missing, unsupported or violates the audit above, do not finish:
      choose the single next event that fixes it, and never pass an item you cannot
      support with event IDs.
  verified:
    kind: branch
    path: finished
    equals: true
    then: done
    otherwise: is_tool_call

  # ---- Routing: each kind of event has its own writer ------------------------------
  is_tool_call:
    kind: branch
    path: task.envelope.kind
    equals: tool_call
    then: write_tool_call
    otherwise: is_tool_result
  is_tool_result:
    kind: branch
    path: task.envelope.kind
    equals: tool_response
    then: write_tool_result
    otherwise: is_chat
  is_chat:
    kind: branch
    path: task.envelope.kind
    equals: chat_message
    then: write_chat
    otherwise: is_external
  is_external:
    kind: branch
    path: task.envelope.kind
    equals: external_text
    then: write_external
    otherwise: write_thought
  write_tool_call:
    kind: event
    next: work
    instruction: >-
      Write this tool call's arguments only, matching the tool's input schema with values
      that are visible in context. Choose what a careful agent would send: specific,
      minimal and verifiable. If this is a fragment of a longer call, continue exactly
      where the previous fragment stopped.
  write_tool_result:
    kind: event
    next: work
    instruction: >-
      Write the result exactly as this tool would return it: a realistic format and
      size, consistent with the world facts and earlier results, including partial
      results, errors, timeouts or surprising data when plausible. Return only what the
      tool could know; never solve the agent's task or comment on its choices.
  write_chat:
    kind: event
    next: work
    instruction: >-
      Write this chat message in the speaker's persona from the world facts and the
      proposal: their competence, patience, involvement and tone. React only to what the
      speaker has actually seen. People clarify, change their minds, push back, add
      requests or go quiet; keep it natural and appropriately brief.
  write_external:
    kind: event
    next: work
    instruction: >-
      Write this external input as its real source would: a document, notification,
      asynchronous update or specialist report. Keep it concrete, consistent with earlier
      facts, and limited to what that source knows.
  write_thought:
    kind: event
    next: work
    instruction: >-
      Write the agent's private reasoning for this step, addressed to no one, from the
      visible evidence: what changed,
      what it means, and what to do next and why. Track hypotheses, verification and
      remaining blockers. When an automation or infrastructure choice is open, weigh
      cost, expected reuse, maintenance and uncertainty from visible evidence and
      revisit it when new information changes the return. Keep it concise and never
      claim an outcome that is not visible.
  done:
    kind: end
