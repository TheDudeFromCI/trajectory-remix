version: draft-assembly/6
review_version: native-review/1
# The agent's behaviour guide. Both Draft and Assembly see it; a persona pack goes here.
actor_instruction: >-
  The agent acts only on visible evidence and the tool contract.
  Reasoning is private thinking, never addressed to anyone: no greetings, no "you", no
  replies. Speak to people only through chat tool calls, including short progress
  updates. Keep reasoning concise.
  Kidra coordinates complex, long-running multi-agent work: she plans, delegates,
  verifies and keeps continuity. When a suitable agent or tool is visible she does not
  personally write production code, run extensive research or do bulk repetitive work.
  Delegate in proportion to the task; a small job needs no team. Select resources using
  observed capabilities and costs, preserve task ownership and dependencies, verify
  claims and replan on failures. Do not re-delegate an unchanged failed task, create
  agents recursively or excessively, or keep planning instead of moving to execution.
  Respect visible budgets and the user's visible authority: for a consequential action
  outside it, request approval and wait.
  Do not claim execution, inspection or completion without visible supporting results.
  Distinguish intentions, reported results, verified outcomes and remaining blockers.
  Never use hidden author targets or predict an unobserved tool outcome.
trajectory_guide: |-
  ## What is a parallel trajectory?

  A parallel trajectory is one authored episode represented as a graph of events
  in logical windows. A window is a stream of context, such as a chatroom,
  private reasoning, a document, or a tool interaction. Each event writes to one
  window. Several windows can be active at the same time.

  An event's `after` list names its prerequisites. An action can use evidence
  from another window when a dependency path makes that evidence available and
  the window still retains it. Independent branches can overlap. The order in
  which you author them does not make one branch depend on the other.

  For example, a request can start two independent inventory checks in separate
  windows. Each result follows its own request. A final comparison depends on
  both results. Keep the result windows open through that comparison. If the
  second check actually needs the first result, add that dependency.

draft_instruction: |-
  # Draft a synthetic episode

  **Deliverable:** one JSON object with a "draft" string of at least 200 characters.
  Write the whole episode in prose. Assembly will assign event and window IDs.

  ## Plan from the proposal
  - Identify the user's request, the starting evidence, the required decisions, and
    the final state. Turn sampled objectives, constraints, and numeric targets into
    observable actions. Keep the sampled targets out of the agent's visible world.
  - Write the user's and agent's actual messages. When the user opens the episode,
    draft a brief acknowledgment before private reasoning.
  - Specify each synthetic call by its catalogue ID and exact arguments. Describe
    the result text, which call it answers, and when the result becomes visible.

  ## Check the handoff to Assembly
  - Follow the causal order: evidence, decision, action, and observation. Specify
    which actions are independent and which must wait for a result or approval.
  - Distinguish a specialist's report from evidence that verifies it. Keep names,
    returned IDs, budgets, and task ownership consistent across the episode.
  - Show what the agent can conclude at the end and any remaining blocker. If a
    correction is present, incorporate it in the complete Draft.

assemble_instruction: |-
  # Assemble a complete trajectory

  ## Plan the graph
  Read the Draft for the opening, decisions, actions, and final outcome. Pick stable
  event and window IDs and sketch the prerequisites for each decision. Use the
  proposal and checklist to check coverage. Preserve the Draft's material facts
  and outcomes.

  ## Write events efficiently
  - Group several ready edits in a reply. Calls run in listed order, so a later call
    can use an ID created earlier in that reply. Create the episode in coherent
    batches instead of spending a reply on every window or event.
  - Use create_event for reasoning, observations, and synthetic requests and results.
    It creates a missing window. Set window_properties only on its first use if the
    default needs changing. Use configure_window for an existing window, to set
    optional properties, or to acknowledge a window intentionally left open.
  - Use short window purposes such as chatroom, reasoning, document, and tool.
    Pass JSON strings once, as in {"window":"work","kind":"agent_text"}.
    Omit optional fields you are leaving unchanged. Use JSON null to clear a
    nullable field. Keep descriptive prose in content.
  - Use post_chat_message for user and agent chat. Agent chat creates a synthetic
    chat request and its delivery. The event_id you give the tool names the delivery,
    so the next event can depend on that ID.
  - Use post_tool_schema with exact project tool IDs. Display names are for people
    reading the catalogue. Open the tools window at the beginning with an empty
    after list. Known tool calls add missing schemas automatically.
    For a generic tool_call, content holds the JSON text of the synthetic arguments.
    A tool_response reuses its call_id and depends on the event that submits it.
    Give each call its own window and keep reasoning in a dedicated window. The
    usual tool window contains the call, its response, then closure. Keep the
    window open until the last event that needs the response. Use the configured
    response window when the tool specifies one.

  ## Check visibility and close working windows
  - after names real event IDs and sets order. A dependency can still point to an
    event whose body is gone. Use view_event on the consuming decision and check
    that the specific evidence IDs appear in its visible windows.
  - Keep tool results, documents, and prior reasoning open until their last
    consumer. For a result used later, leave close_window false on the response.
    After the decision that uses it, add an empty agent_text event in the tool
    window with close_window true and after containing the last consumer. For a
    read-only window, use an empty external_text closure. Order any replacement
    after the last consumer too. If evidence was copied into a retained window,
    depend on the event that actually holds the copy.
  - Order all writers to the same window. Give independent actions separate
    windows where appropriate. Keep external observations masked and supervise
    agent outputs unless the sample calls for a different mask.
  - Use update_event to fix a specific edit. After deleting an event, repair any
    dependencies that pointed to it.

  ## Example opening batch
  These are arguments for successive native calls. Use the tool names supplied by
  the provider and adapt the content to the Draft.
  1. post_chat_message {"event_id":"ask","origin":"user","speaker":"Sam","content":"How many boxes remain?"}
  2. post_chat_message {"event_id":"ack","origin":"agent","speaker":"Kidra","content":"I'll check the inventory.","after":["ask"]}
  3. create_event {"event_id":"inventory","window":"records","kind":"external_text","content":"Inventory lists three boxes.","after":["ack"]}
  4. post_chat_message {"event_id":"answer","origin":"agent","speaker":"Kidra","content":"The inventory lists three boxes.","after":["inventory"]}
  5. view_diagnostics {}

  ## Sign off
  Use view_graph to check coverage and view_event or view_window for specific
  evidence. Use view_diagnostics after edits to check errors and enabled warnings.
  Fix reported problems and verify the final graph. Call signoff with completeness
  and Draft-fidelity evidence, citing actual event IDs. Put signoff last in its batch.

review_instruction: |-
  # Review a complete trajectory

  ## Recognize the episode
  Trace the request or starting state, the agent's decisions and actions, the
  observations that support them, and the outcome or blocker. Check that these
  satisfy the supplied objective, targets, and criteria. Check Draft fidelity
  when a Draft is supplied. Independent work can overlap; work that needs earlier
  evidence must wait for it. Judge the dependencies the task actually requires.

  Expect user messages in chat, agent messages sent by a synthetic chat call and
  delivered in chat, and private reasoning in a dedicated window. The tools window
  opens at the start with no prerequisites. A typical tool window holds one call
  and its matching response. Some tools deliver the response in a separate window,
  as chat does. Check the response identity and placement against the tool. A
  window that holds needed evidence must retain it through its last consumer.

  ## Inspect the evidence once
  1. Start from the graph, diagnostics, and criteria in the initial message.
     Locate the opening, material decisions, tool results, and final claims.
     Use the diagnostics to focus your reads on reported problems.
  2. Group related reads in one reply. Use view_window for bodies in a relevant
     window and view_event for a specific decision and its visible event IDs.
     Reuse those results across criteria. Follow a gap when it could change a
     verdict. The review source stays fixed, so the initial graph and diagnostics
     remain current.
  3. For each material use of earlier evidence, use view_event on the consuming
     agent event. Find the source ID in its visible windows and check the source
     body supports the decision. An after link orders events. Visibility also
     depends on closure and replacement, in any window. For example, a comparison
     that depends on two results needs both result IDs in its visible windows.
     If the episode uses a retained copy, check and cite the event holding it.

  ## Sign off
  Give a verdict with specific evidence for every supplied criterion. For a pass
  on core.causal_evidence, record each material consumer and its visible source
  IDs in causal_claims. For a failure, identify the decision, the missing or
  contradictory evidence, and the window or dependency that caused the problem
  when known. Call signoff once the verdicts are supported. Use only the read
  tools and signoff.
