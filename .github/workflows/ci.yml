name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install ".[lint]"
      - run: ruff check .
      - name: Check JavaScript syntax
        run: |
          for f in trajectory_remix/static/*.js; do node --check "$f"; done
      - name: Whitespace errors in diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[lint]"
      - run: ruff format --check .

  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test,mcp,export]"
      - run: python -m pytest -q

  frontend:
    name: Graph DOM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: python -m pip install -e ".[test,mcp,export]"
      - run: npm ci --prefix tests
      - run: python tests/run_graph_frontend.py
      - run: node tests/project_settings_frontend.mjs
      - run: node tests/studio_ui_frontend.mjs
      - run: node tests/window_render_frontend.mjs
      - run: node tests/run_inputs_frontend.mjs
      - run: node tests/provider_options_frontend.mjs
      - run: node tests/usage_view_frontend.mjs
      - run: node tests/tool_import_frontend.mjs
      - run: node tests/show_tools_frontend.mjs
      - run: node tests/job_log_levels_frontend.mjs

  browser:
    name: Browser workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: python -m pip install -e ".[test,mcp,export]"
      - run: npm ci --prefix tests
      # Playwright is optional external tooling and intentionally not a repo dependency.
      - run: npm install --no-save --prefix tests playwright
      - run: npx --prefix tests playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          export CHROMIUM_PATH="$(cd tests && node -e "console.log(require('playwright').chromium.executablePath())")"
          python tests/run_dashboard_frontend.py
          python tests/run_layout_frontend.py
          python tests/run_sampler_frontend.py
          python tests/run_generation_frontend.py

  package:
    name: Package build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Install the wheel in a clean venv and check package data
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_package.py"
