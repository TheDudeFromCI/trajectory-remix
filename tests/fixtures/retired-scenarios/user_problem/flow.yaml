version: 1
tag: user_scenario
system_prompt: You are Kidra, a patient, competent coordinator. Use available observations
  and ask for clarification when needed.
description: A user problem with simulated tools, variable conversation length, draft
  review, and repair.
schemas:
  Idea:
    type: object
    properties:
      problem: &id001
        type: string
        minLength: 1
      situation: *id001
      success_criteria: *id001
      files:
        type: array
        maxItems: 12
        items:
          type: object
          properties:
            path:
              type: string
              minLength: 1
            content:
              type: string
          required:
          - path
          - content
          additionalProperties: false
      identifier:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+){2,3}$
    required:
    - problem
    - situation
    - success_criteria
    - files
    - identifier
    additionalProperties: false
  Solution:
    type: object
    properties:
      answer: *id001
      verification: *id001
    required:
    - answer
    - verification
    additionalProperties: false
  Message:
    type: object
    properties:
      text: *id001
    required:
    - text
    additionalProperties: false
  ToolPlan:
    type: object
    properties:
      calls:
        type: array
        maxItems: 8
        items:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            properties:
              tool: *id001
              arguments:
                type: object
              outcome:
                type: object
            required:
            - tool
            - arguments
            additionalProperties: false
    required:
    - calls
    additionalProperties: false
  Assessment:
    type: object
    properties:
      resolved:
        type: boolean
      next_exchange:
        type: string
    required:
    - resolved
    - next_exchange
    additionalProperties: false
tags:
  complexity:
  - name: simple
    description: A focused problem with few dependencies.
  - name: moderate
    description: A few related steps with a clear goal and manageable constraints.
  - name: complex
    description: Several interacting constraints or dependent steps.
  - name: underspecified
    description: Missing or ambiguous requirements need clarification before a reliable
      answer.
  - name: competing priorities
    description: Tradeoffs between explicit goals require explaining and choosing
      a compromise.
  domain:
  - name: coding
    description: Implement, debug, review, or explain code using supplied source and
      requirements.
  - name: planning
    description: Turn a goal and constraints into an actionable plan.
  - name: mathematics
    description: Solve or explain arithmetic, algebra, geometry, or other mathematical
      problems.
  - name: science
    description: Explain a scientific concept or evaluate a claim against supplied
      observations.
  - name: history
    description: Interpret historical sources, compare accounts, or explain a historical
      sequence.
  - name: memory retrieval
    description: Recover relevant details from supplied earlier conversations, notes,
      or memory records.
  - name: TODOs
    description: Extract, prioritize, reconcile, or update action items from supplied
      lists and messages.
  - name: politics
    description: Analyze political institutions, arguments, or supplied policy proposals
      and evidence.
  - name: creative writing
    description: Draft or revise fiction, poetry, dialogue, or a story outline under
      explicit constraints.
  - name: data analysis
    description: Interpret a supplied dataset, identify patterns, or check a data-driven
      conclusion.
  - name: statistics
    description: Reason about probability, uncertainty, sampling, or the interpretation
      of a study.
  - name: logic
    description: Solve a logic puzzle or examine whether a conclusion follows from
      its premises.
  - name: physics
    description: Explain physical behavior or solve a problem using stated quantities
      and assumptions.
  - name: chemistry
    description: Interpret chemical concepts, equations, or supplied experimental
      observations.
  - name: biology
    description: Explain biological mechanisms or interpret supplied observations
      about living systems.
  - name: earth science
    description: Reason about geology, weather, climate, or environmental observations
      from supplied information.
  - name: astronomy
    description: Explain astronomical concepts or interpret a supplied observation
      or dataset.
  - name: geography
    description: Reason about places, maps, spatial relationships, or supplied geographic
      information.
  - name: civics
    description: Explain public institutions, civic processes, or responsibilities
      using supplied reference material.
  - name: economics
    description: Analyze incentives, tradeoffs, markets, or a simplified economic
      model with stated assumptions.
  - name: personal finance
    description: Compare budgets, savings plans, fees, or household costs using supplied
      figures and terms.
  - name: law and policy
    description: Compare or explain supplied rules, contracts, or policy language
      and identify ambiguities.
  - name: philosophy
    description: Clarify a philosophical question, distinguish concepts, or evaluate
      an argument.
  - name: ethics
    description: Explore an ethical dilemma, competing responsibilities, or the consequences
      of a decision.
  - name: education
    description: Teach a concept, diagnose a misunderstanding, or adapt a lesson to
      a learner's needs.
  - name: language learning
    description: Explain grammar, vocabulary, usage, or a learner's mistakes with
      concrete examples.
  - name: translation
    description: Translate or compare wording while preserving meaning, register,
      and relevant cultural context.
  - name: editing
    description: Improve supplied prose for clarity, structure, tone, or consistency
      while preserving its intent.
  - name: technical writing
    description: Create or improve instructions, documentation, or an explanation
      from supplied technical facts.
  - name: document review
    description: Summarize, compare, or reconcile supplied documents, including conflicting
      statements and missing details.
  - name: research synthesis
    description: Combine supplied sources into an evidence-based answer while tracking
      disagreements and uncertainty.
  - name: knowledge organization
    description: Organize notes, classify information, link related records, or design
      a useful retrieval structure.
  - name: scheduling
    description: Reconcile calendars, durations, availability, time zones, or deadlines
      from supplied records.
  - name: project management
    description: Identify dependencies, milestones, risks, or responsibilities in
      a supplied project brief.
  - name: logistics
    description: Plan routing, inventory, packing, staffing, or resource allocation
      under explicit constraints.
  - name: troubleshooting
    description: Diagnose a malfunction from supplied symptoms, logs, instructions,
      and test results.
  - name: design
    description: Develop or critique a product, interface, or visual concept against
      a concrete brief.
  - name: accessibility
    description: Review supplied content or a design for barriers and propose practical
      accessible alternatives.
  - name: health literacy
    description: Explain supplied health information, interpret instructions, or prepare
      questions for a clinician.
  - name: cooking
    description: Adapt a recipe, plan a meal, or solve a cooking problem with supplied
      ingredients and constraints.
  - name: gardening
    description: Interpret plant-care records or plan planting and maintenance from
      supplied conditions.
  - name: travel
    description: Compare supplied itinerary options, packing needs, costs, or travel
      constraints without live booking.
  - name: music
    description: Explain music theory, analyze supplied musical material, or plan
      practice around a learner's goals.
  - name: games
    description: Explain rules, analyze a game state, or design a puzzle or game mechanic
      with checkable constraints.
  - name: communication
    description: Draft or revise a message, handle a disagreement, or adapt an explanation
      to its audience.
roles:
  user:
    instructions: Write only the fictional user. Preserve their domain knowledge and
      behavior naturally.
    tags:
      behavior:
      - name: angry
        description: Frustrated and willing to challenge an answer; not automatically
          abusive.
      - name: polite
        description: Courteous and cooperative without necessarily agreeing with every
          suggestion.
      - name: impatient
        description: Wants progress quickly and may interrupt explanations or push
          for a shorter answer.
      - name: skeptical
        description: Questions assumptions and asks for evidence before accepting
          an answer.
      - name: terse
        description: Gives short replies with little elaboration; clarify important
          omissions naturally.
      - name: verbose
        description: Provides lengthy explanations and tangents that require identifying
          the relevant details.
      - name: anxious
        description: Worried about making a mistake and may need clear explanations
          or reassurance.
      - name: enthusiastic
        description: Eager to explore ideas and may propose additions beyond the original
          request.
      - name: distracted
        description: Loses track of details or shifts focus, requiring concise reminders
          of the current goal.
      - name: indecisive
        description: Finds tradeoffs difficult and benefits from a clear comparison
          and recommendation.
      - name: blunt
        description: Speaks directly with little social cushioning, without necessarily
          being hostile.
      - name: sarcastic
        description: Uses dry or ironic remarks while still expressing an identifiable
          underlying need.
      - name: demanding
        description: Has high expectations and challenges incomplete results or unmet
          requirements.
      knowledge:
      - name: novice
        description: Has little domain knowledge and needs concepts and assumptions
          explained plainly.
      - name: expert
        description: Knows the domain well and expects precise reasoning, relevant
          details, and justified conclusions.
      - name: confidently mistaken
        description: Strongly believes a specific misconception that must be identified
          and corrected with evidence.
      - name: intermediate
        description: Understands common concepts but needs help with unfamiliar cases
          or deeper implications.
      - name: uneven knowledge
        description: Knows some parts of the domain well but has important gaps in
          related areas.
      - name: outdated knowledge
        description: Relies on an older version of a method or rule that differs from
          the supplied current reference.
      - name: practical experience
        description: Can perform familiar tasks but may lack formal terminology or
          an explanation of why they work.
      - name: theoretical knowledge
        description: Understands concepts but has little experience applying them
          to concrete situations.
  kidra:
    instructions: Kidra is patient, competent, direct, and helpful. Clarify missing
      facts; never assume unseen tool results.
steps:
  idea:
    uses: llm.generate
    prompt: idea.md
    needs: []
    inputs:
      requirements: Create a concrete user problem suitable for the virtual tool environment.
      tags: ${scenario.tags}
      user_profile: ${roles.user}
    output_schema: Idea
    retries: 1
  novelty:
    uses: remix.novelty
    max_input_tokens: 6000
    needs:
    - idea
    prompt: novelty.md
    inputs:
      idea: ${steps.idea.output}
      idea_step: idea
      threshold: 0.85
    attempts: 3
    fallback: true
  environment:
    uses: remix.setup
    needs:
    - novelty
    inputs:
      idea: ${steps.novelty.output}
  solution:
    uses: llm.generate
    prompt: solution.md
    needs:
    - novelty
    inputs:
      problem: ${steps.novelty.output.problem}
      success_criteria: ${steps.novelty.output.success_criteria}
      situation: ${steps.novelty.output.situation}
      files: ${steps.novelty.output.files}
    output_schema: Solution
    retries: 1
  conversation:
    uses: flow.repeat
    needs:
    - solution
    - environment
    max_iterations: 4
    until: ${steps.assess.output.resolved}
    history:
      user: ${steps.user.output.text}
      response: ${steps.answer.output.text}
      assessment: ${steps.assess.output}
    inputs:
      idea: ${steps.novelty.output}
      solution: ${steps.solution.output}
    steps:
      user:
        uses: llm.generate
        prompt: user.md
        needs: []
        inputs:
          situation: ${inputs.idea.situation}
          problem: ${inputs.idea.problem}
          history: ${iteration.history}
          round: ${iteration.index}
          files: ${inputs.idea.files}
        output_schema: Message
        retries: 1
        profile: user
      message:
        uses: remix.message
        needs:
        - user
        inputs:
          text: ${steps.user.output.text}
      tools:
        uses: llm.generate
        prompt: tools.md
        needs:
        - message
        inputs:
          request: ${steps.user.output.text}
          history: ${iteration.history}
          tools: ${tools}
        output_schema: ToolPlan
        retries: 1
      observations:
        uses: remix.tools
        needs:
        - tools
        inputs:
          calls: ${steps.tools.output.calls}
      reasoning:
        uses: llm.generate
        prompt: reasoning.md
        needs:
        - observations
        inputs:
          request: ${steps.user.output.text}
          history: ${iteration.history}
          observations: ${steps.observations.output.results}
        output_schema: Message
        retries: 1
        profile: kidra
      answer:
        uses: llm.generate
        prompt: answer.md
        needs:
        - reasoning
        inputs:
          request: ${steps.user.output.text}
          history: ${iteration.history}
          reasoning: ${steps.reasoning.output.text}
        output_schema: Message
        retries: 1
        profile: kidra
      draft:
        uses: remix.draft
        needs:
        - answer
        inputs:
          reasoning: ${steps.reasoning.output.text}
          response: ${steps.answer.output.text}
          release_tool_context: true
      assess:
        uses: llm.generate
        prompt: assess.md
        needs:
        - draft
        inputs:
          success_criteria: ${inputs.idea.success_criteria}
          solution: ${inputs.solution}
          request: ${steps.user.output.text}
          answer: ${steps.answer.output.text}
          history: ${iteration.history}
        output_schema: Assessment
        retries: 1
  validate:
    uses: remix.validate
    needs:
    - conversation
    endpoint: validator
    checks:
      layout:
        rules:
          actor_separation:
            requirement: 'Preserve actor ownership, visibility and supervision: user
              inputs, specialist replies and external observations are not Kidra decisions.
              Keep author instructions, raw logs, secrets and irrelevant scaffolding
              out of Kidra output.'
          attachment_separation:
            requirement: Supply each attachment as separate document context with
              the user request, not whole-file chat prose. Invisible file setup does
              not expose an attachment to Kidra.
            allow_not_applicable: true
          coherent_windows:
            requirement: Give each window one coherent purpose. Keep system instructions,
              documents, reasoning, conversation and tool interactions distinct; avoid
              unrelated full observations in reasoning/chat.
          context_retention:
            requirement: Evidence must remain active throughout dependent generation,
              including every chat-request token. Closed/replaced context is lost
              unless sufficient facts were retained elsewhere; a reference or promise
              to remember is insufficient. Use resolved timing.
          prompt_context_release:
            requirement: Close documents, results and temporary reasoning after their
              last actual consumer. Do not retain all windows until the final reply
              by default. Compact large documents into exact needed facts/caveats
              and source versions when this enables useful earlier closure.
        prompt: validate-layout.md
        view: layout
        inputs:
        - idea.problem
        events_per_chunk: 10
        overlap: 2
        max_input_tokens: 6000
        content_tokens: 800
      tools:
        rules:
          observation_grounding:
            requirement: Claims agree with canonical tool outcomes and availability.
              Do not invent observations, duplicate results or treat failure/cancellation
              as success. A partial read/search cannot prove unseen content; follow
              continuations when needed.
            allow_not_applicable: true
          causal_knowledge:
            requirement: Use facts only after they become available to Kidra. All
              active Kidra windows share attention; invisible mutations and author
              inspections are not observations. Future results/revisions and lost
              context cannot inform earlier tokens.
          useful_calls:
            requirement: Each call adds needed information/action. Rereading an unchanged
              visible attachment, relisting known paths or fetching automatically
              visible TODOs needs an additional purpose. Preserve reads of unseen
              files, changed versions or needed metadata.
            allow_not_applicable: true
          parallel_calls:
            requirement: Overlap useful independent calls once inputs are ready. Wait
              only for relevant dependencies, not unrelated work or an entire reasoning
              stream. Judge resolved dispatch/result intervals; do not force artificial
              concurrency.
            allow_not_applicable: true
          specialist_context:
            requirement: Specialist replies follow from their tasks, retained conversations
              and explicitly shared artifact versions, not all Kidra windows. Follow-ups
              build on prior replies; reviews cannot certify unseen newer versions.
            allow_not_applicable: true
          artifact_consistency:
            requirement: Edit/review/test/completion claims match authored files,
              versions and external mutations. A claimed file write does not publish
              it. Synthetic tests must be plausible for supplied artifacts; do not
              claim Remix ran authored code/tests.
            allow_not_applicable: true
          status_and_recovery:
            requirement: Progress, TODO meanings/statuses, reviews, clarifications
              and handoff agree with observed work. Respond coherently to failures,
              rejections, changes and blockers. Do not invent host processes or wall-clock
              runtimes.
            allow_not_applicable: true
        prompt: validate-tools.md
        view: tools
        inputs:
        - idea.problem
        events_per_chunk: 10
        overlap: 2
        max_input_tokens: 6000
        content_tokens: 800
      reasoning:
        rules:
          private_working_notes:
            requirement: Reasoning is private task-directed notes on evidence, uncertainty
              and decisions. User-addressed reassurance/advice, greetings, closing
              offers or a duplicated answer draft fail even on simple tasks. Concise
              private calculations are fine.
          parallel_analysis:
            requirement: Overlap useful independent analyses in separate reasoning
              windows when inputs are ready. Flag concrete unnecessary serialization;
              preserve real dependencies and avoid redundant parallel work.
          evidence_transfer:
            requirement: Retained summaries preserve needed constraints, values, quotes,
              caveats and source/version references. They must support later claims
              without closed/replaced originals. Whole-document duplication without
              useful earlier closure is not effective extraction.
          role_behavior:
            requirement: User traits shape the user naturally without changing Kidra's
              configured personality. Expertise is not infallibility; frustration
              does not require abuse. Kidra stays consistent with its role profile.
          dialogue_continuity:
            requirement: Address the current exchange without unnecessary repetition.
              Preserve established facts/corrections; follow-ups and clarifications
              reflect each actor's knowledge. Do not leak author-only reference solutions.
          coordination:
            requirement: For coordination tasks, Kidra delegates appropriately, integrates
              specialist evidence and follows actual blockers rather than doing all
              specialist implementation. Do not demand delegation for simple tasks.
            allow_not_applicable: true
        prompt: validate-reasoning.md
        view: reasoning
        inputs:
        - roles.user.tags
        - roles.kidra.instructions
        events_per_chunk: 10
        overlap: 2
        max_input_tokens: 6000
        content_tokens: 800
      correctness:
        rules:
          independent_verification:
            requirement: Verify facts, calculations, logic, graph edges/cycles, schedules,
              units, quotations and causal claims against the original task and evidence.
              Reference/success-criteria agreement is insufficient; identify reference
              defects.
          literal_constraints:
            requirement: 'Satisfy every explicit constraint literally. Runtime workarounds
              do not prove static/build compliance: function-local imports may still
              be tracked edges. Do not relax requirements or substitute a task without
              evidence.'
          extremal_claims:
            requirement: Try counterexamples to minimality, uniqueness, necessity
              and optimality. Spare schedule capacity does not force an unrelated
              module into that batch. Claims must follow from actual constraints.
            allow_not_applicable: true
          usable_changes:
            requirement: Proposed code/plans/edits implement the described fix and
              work together. Removing an import while leaving an unresolved reference
              is incomplete. Check artifacts and interactions, not prose alone.
            allow_not_applicable: true
          calibrated_uncertainty:
            requirement: Distinguish facts from assumptions/uncertainty. Resolve consequential
              ambiguity through evidence or clarification. Do not invent requirements
              or claim unsupported verification.
          task_fulfillment:
            requirement: 'The actual request is resolved with a correct, usable result
              meeting its constraints. Establish sufficient conversation history:
              an earlier delivered reply may solve the task and the final answer may
              merely acknowledge it.'
            scope: sample
        prompt: validate-correctness.md
        view: correctness
        inputs:
        - idea.problem
        - idea.success_criteria
        events_per_chunk: 10
        overlap: 2
        max_input_tokens: 6000
        content_tokens: 800
    repair_prompt: repair-edits.md
    repair_mode: edits
    repair_max_input_tokens: 10000
    repair_guides:
    - repair-notes.md
    max_repairs: 2
    review_retries: 2
    inputs:
      require_chat_delivery: true
      tags: ${scenario.tags}
      roles: ${roles}
      solution: ${steps.solution.output}
      idea: ${steps.novelty.output}
    level: 1
generation_mode: existing
