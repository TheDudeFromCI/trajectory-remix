version: 1
generation_mode: content-first
tag: content_first
description: Parallel reasoning with generated tool decisions, delayed observations, and external review.
system_prompt: You are Kidra. Coordinate windows, use actual tool results, and deliver replies with chat.
tags:
  domain:
    - {name: logistics, description: Reconcile an invoice and a reported total.}
    - {name: planning, description: Compare a written plan with a reported estimate.}
  complication:
    - {name: missing, description: A referenced file is missing; acknowledge the gap.}
    - {name: contradictory, description: A reported total contradicts the arithmetic.}
roles:
  kidra:
    instructions: Reason only from visible inputs. Never assume a tool succeeded.
schemas:
  Brief:
    type: object
    properties:
      problem: {type: string}
      situation: {type: string}
      success_criteria: {type: string}
      files:
        type: array
        items:
          type: object
          properties:
            path: {type: string}
            content: {type: string}
          required: [path, content]
          additionalProperties: false
    required: [problem, situation, success_criteria, files]
    additionalProperties: false
  Decisions:
    type: object
    properties:
      calls:
        type: array
        maxItems: 3
        items:
          type: object
          properties:
            tool: {type: string, enum: [calculator, file_read]}
            arguments: {type: object}
          required: [tool, arguments]
          additionalProperties: false
    required: [calls]
    additionalProperties: false
  Reply:
    type: object
    properties:
      reasoning: {type: string}
      response: {type: string}
    required: [reasoning, response]
    additionalProperties: false
steps:
  idea:
    uses: llm.content
    prompt: brief.md
    inputs:
      conditions: ${scenario.tags}
    output_schema: Brief
  setup:
    uses: remix.setup
    needs: [idea]
    inputs:
      idea: ${steps.idea.output}
  message:
    uses: remix.message
    needs: [setup]
    inputs:
      text: ${steps.idea.output.problem}
  arithmetic:
    uses: llm.content
    prompt: arithmetic.md
    needs: [message]
    profile: kidra
    visible_windows: [chat]
  uncertainty:
    uses: llm.content
    prompt: uncertainty.md
    needs: [message]
    profile: kidra
    visible_windows: [chat]
  decisions:
    uses: llm.content
    prompt: decisions.md
    needs: [message]
    visible_windows: [chat]
    output_schema: Decisions
    inputs:
      available_tools:
        - {name: calculator, arguments: {expression: string}}
        - {name: file_read, arguments: {path: string}}
  parallel:
    uses: remix.assemble
    needs: [arithmetic, uncertainty, decisions]
    inputs:
      streams:
        - window: arithmetic
          type: reasoning
          content: ${steps.arithmetic.output}
        - window: uncertainty
          type: reasoning
          content: ${steps.uncertainty.output}
      calls: ${steps.decisions.output.calls}
  reaction:
    uses: llm.content
    prompt: reaction.md
    needs: [parallel]
    profile: kidra
    visible_windows: [chat, arithmetic, uncertainty]
    inputs:
      observations: ${steps.parallel.output.results}
    output_schema: Reply
  draft:
    uses: remix.draft
    needs: [reaction]
    inputs:
      reasoning: ${steps.reaction.output.reasoning}
      response: ${steps.reaction.output.response}
  validate:
    uses: remix.validate
    needs: [draft]
    endpoint: validator
    prompt: review.md
    inputs:
      original_requirements: ${steps.idea.output}
