[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-remix"
version = "0.1.0"
description = "Local authoring, replay, synthesis and export studio for Project Kidra"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "tokenizers>=0.20,<1", "httpx>=0.27,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
trajectory-remix = "trajectory_remix.__main__:main"
trajectory-remix-mcp = "trajectory_remix.mcp_server:main"

[tool.setuptools.package-data]
trajectory_remix = ["static/*", "Skill.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
