[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-remix"
version = "0.1.0"
description = "Local authoring, replay, synthesis and export studio for Project Kidra"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "tokenizers>=0.20,<1", "httpx>=0.27,<1", "pydantic>=2.11,<3", "tzdata>=2024.1", "jsonschema>=4.23,<5", "cloudpickle>=3.1,<4", "simpleeval>=1.0.3,<2", "PyYAML>=6,<7", "openai>=2.11,<3", "pydantic-ai-slim[openai]>=1.107.9,<2"]

[project.optional-dependencies]
inference = ["transformers>=4.45,<6", "jinja2>=3.1,<4"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
trajectory-remix = "trajectory_remix.__main__:main"
trajectory-remix-mcp = "trajectory_remix.mcp_server:main"

[tool.setuptools.package-data]
trajectory_remix = ["static/*", "Skill.md", "guides/*.md", "build-graph-analysis.json", "scenario_templates/*/*.yaml", "scenario_templates/*/*.md", "review_templates/*.yaml", "review_templates/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["trajectory_remix*"]
